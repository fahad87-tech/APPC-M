<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curve Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:linear-gradient(135deg,#0f172a,#1e293b);color:#e5e7eb;min-height:100vh;font-size:1.05rem}
.app-container{max-width:1800px;margin:auto;padding:16px}
.header{background:rgba(15,23,42,.8);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px;margin-bottom:10px}
.header-top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
h1{font-size:1.9rem;background:linear-gradient(90deg,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:#94a3b8;font-size:1rem}
.tab-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab-btn{padding:10px 20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#94a3b8;cursor:pointer;font-size:1rem;font-weight:600}
.tab-btn:hover{background:rgba(255,255,255,.1);color:#e2e8f0}
.tab-btn.active{background:#8b5cf6;border-color:#a78bfa;color:#fff}
.tab-content{display:none}
.tab-content.active{display:block}
.controls-row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.control-group{display:flex;flex-direction:column;gap:2px}
.control-group label{font-size:.85rem;color:#94a3b8}
.control-group input,.control-group select{background:rgba(30,41,59,.8);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:8px 10px;font-size:.95rem}
.class-select{min-width:180px}
.cat-wrap{display:flex;align-items:center;gap:4px;margin-right:4px}
.cat-toggle{display:flex;align-items:center;gap:5px;padding:6px 12px;background:rgba(30,41,59,.8);border:1px solid rgba(255,255,255,.15);border-radius:6px;cursor:pointer}
.cat-toggle.enabled{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.4)}
.cat-dot{width:12px;height:12px;border-radius:50%}
.cat-label{font-size:.95rem;font-weight:700}
.cat-input{width:55px;padding:5px;border-radius:4px;border:1px solid rgba(255,255,255,.15);background:rgba(30,41,59,.8);color:#fff;font-size:.95rem;text-align:center}
.btn{border:none;border-radius:6px;padding:9px 14px;font-size:.95rem;font-weight:600;cursor:pointer;color:#fff}
.btn:hover{filter:brightness(1.1)}
.btn-primary{background:linear-gradient(135deg,#8b5cf6,#a78bfa)}
.btn-secondary{background:#475569}
.btn-success{background:linear-gradient(135deg,#10b981,#34d399)}
.table-container{overflow:auto;border-radius:10px;border:1px solid rgba(255,255,255,.1);margin:12px 0;max-height:520px}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;background:#1e293b;color:#f1f5f9;text-align:left;padding:12px 6px 12px 10px;font-size:1rem;font-weight:700;border-bottom:2px solid rgba(139,92,246,.3)}
thead th:first-child{text-align:center;width:40px}
tbody td{padding:10px 6px 10px 10px;border-bottom:1px solid rgba(255,255,255,.05);font-size:1.05rem;text-align:left}
tbody td:first-child{text-align:center;width:40px;color:#94a3b8;cursor:grab;user-select:none}
tbody tr.dragging{opacity:.4}
tbody tr.drag-over-top{box-shadow:inset 0 3px 0 0 #a78bfa}
tbody tr.drag-over-bottom{box-shadow:inset 0 -3px 0 0 #a78bfa}
tbody td:first-child:active{cursor:grabbing}
.col-name{font-weight:600;min-width:180px}
.col-input{width:95px}
.col-input input{width:85px;padding:8px 6px;border-radius:5px;border:1px solid rgba(255,255,255,.15);background:rgba(30,41,59,.8);color:#fff;font-size:1.05rem;text-align:center}
.col-highlight{color:#86efac;font-weight:700}
.col-error{color:#f87171;font-weight:700}
.ap-badge{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:24px;border-radius:999px;font-weight:700;font-size:.9rem;color:#fff}
.ap-1{background:#ef4444}.ap-2{background:#f97316}.ap-3{background:#eab308;color:#1a1a2e}.ap-4{background:#22c55e}.ap-5{background:#3b82f6}
.delete-btn{border:none;background:rgba(239,68,68,.8);color:#fff;border-radius:5px;width:28px;height:28px;cursor:pointer;font-size:1rem}
.legend-panel{background:rgba(15,23,42,.6);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px;margin-top:12px}
.legend-panel h3{font-size:1.1rem;color:#a78bfa;margin-bottom:8px}
.legend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px}
.legend-card{background:rgba(30,41,59,.6);border-radius:8px;padding:10px}
.legend-card-header{display:flex;justify-content:space-between;margin-bottom:8px;font-size:1.05rem}
.legend-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.legend-row label{width:80px;font-size:.9rem;color:#94a3b8}
.legend-row input{width:70px;padding:5px;border-radius:4px;border:1px solid rgba(255,255,255,.15);background:rgba(15,23,42,.8);color:#fff;font-size:.95rem;text-align:center}
.formula-panel{background:rgba(15,23,42,.6);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px;margin-top:12px}
.formula-panel h3{font-size:1.1rem;color:#a78bfa;margin-bottom:8px}
.formula-input{flex:1;min-width:280px;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(30,41,59,.8);color:#fff;font-size:1.1rem;font-family:Consolas,monospace}
.formula-status{font-size:.95rem;color:#94a3b8;margin-top:6px}
.formula-help{font-size:.85rem;color:#64748b;margin-top:6px;line-height:1.5}
.modal-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2, 6, 23, .8);z-index:100}
.modal-overlay.show{display:flex}
.modal{width:94%;max-width:420px;background:#1e293b;border-radius:12px}
.modal-header{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.1);font-size:1.1rem}
.modal-body{padding:16px}
.modal-body input{width:100%;padding:10px;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:rgba(30,41,59,.8);color:#fff;font-size:1.05rem}
.modal-footer{display:flex;justify-content:flex-end;gap:6px;padding:12px 16px;border-top:1px solid rgba(255,255,255,.1)}
.toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:#fff;padding:14px 24px;border-radius:8px;font-size:1rem;z-index:200;display:none}
</style>
</head>
<body>
<div class="app-container">
<header class="header">
<div class="header-top"><div><h1>Curve Manager</h1><p class="subtitle">Multi-Category Grading - Auto-saves all entries</p></div>
<div style="display:flex;gap:5px"><button id="clearBtn" class="btn btn-secondary">Clear All</button><button id="reloadBtn" class="btn btn-secondary">Reload</button><button id="exportBtn" class="btn btn-secondary">Export</button></div></div>
<div class="tab-nav">
<button class="tab-btn active" id="tabAp" data-tab="ap">AP Curve</button>
<button class="tab-btn" id="tabFormula" data-tab="formula">Formula Curve</button>
</div>
<div class="controls-row">
<div class="control-group"><label>Class</label><select id="classSelector" class="class-select"></select></div>
<div id="catToggles" style="display:flex;gap:4px;flex-wrap:wrap;align-items:center"></div>
<div class="control-group"><label>Max Raw</label><input type="number" id="maxRaw" value="100"></div>
<div class="control-group"><label>Assignment</label><input type="text" id="assignName" placeholder="Test name"></div>
<button id="addBtn" class="btn btn-primary">Add Student</button>
</div>
</header>

<div id="tab-ap" class="tab-content active">
<div class="table-container">
<table id="apTable"><thead><tr>
<th>#</th><th>Student</th><th>MCQ</th><th>FIB</th><th>SA</th><th>FRQ</th><th>Raw</th><th>Raw%</th><th>Curved%</th><th style="width:50px">AP</th><th style="width:30px"></th>
</tr></thead><tbody id="apBody"></tbody></table>
</div>
<div class="legend-panel"><h3>AP Curve Legend</h3><div id="apLegend" class="legend-grid"></div></div>
</div>

<div id="tab-formula" class="tab-content">
<div class="table-container">
<table id="formulaTable"><thead><tr>
<th>#</th><th>Student</th><th>MCQ</th><th>FIB</th><th>SA</th><th>FRQ</th><th>Raw</th><th>Raw%</th><th>Curved%</th><th style="width:30px"></th>
</tr></thead><tbody id="formulaBody"></tbody></table>
</div>
<div class="formula-panel"><h3>Curve Formula</h3>
<input id="formulaInput" class="formula-input" value="=RAW_PCT" placeholder="=ROUND(RAW_PCT*1.08,1)">
<div id="formStatus" class="formula-status"></div>
<div class="formula-help">Variables: RAW, RAW_PCT, MCQ, FIB, SA, FRQ, MAX_RAW | Functions: ROUND, MIN, MAX, IF, ABS, SQRT, SUM, AVG</div>
</div>
</div>
</div>

<div id="addModal" class="modal-overlay">
<div class="modal">
<div class="modal-header"><h2>Add Student</h2><button class="btn btn-secondary" id="closeModal">×</button></div>
<div class="modal-body"><input type="text" id="newStudent" placeholder="Name"></div>
<div class="modal-footer"><button class="btn btn-secondary" id="cancelModal">Cancel</button><button class="btn btn-primary" id="okModal">Add</button></div>
</div>
</div>
<div id="toast" class="toast"></div>

<script>
(function(){
const KEY='curve_v3',CLSKEY='classRotatorData';
const CATS=[{id:'mcq',color:'#3b82f6',max:40,scale:52,sc:true},{id:'fib',color:'#10b981',max:10,scale:10},{id:'sa',color:'#f59e0b',max:15,scale:15},{id:'frq',color:'#a855f7',max:48,scale:48}];
const BANDS=[{rMin:70,rMax:100,cMin:90,cMax:100,ap:5},{rMin:54,rMax:69.9,cMin:75,cMax:89,ap:4},{rMin:40,rMax:53.9,cMin:60,cMax:74,ap:3},{rMin:25,rMax:39.9,cMin:30,cMax:59,ap:2},{rMin:0,rMax:24.9,cMin:0,cMax:29,ap:1}];
let cls='',mode='ap',cs={},ab=[],fm='=RAW_PCT',mr=100,st=[],savedScores={},orders={},dragRow=null;
const $=id=>document.getElementById(id);

async function initClassData(){
  if(localStorage.getItem(CLSKEY))return;
  try{
    const r=await fetch('students_data.json?t='+Date.now());
    if(!r.ok)return;
    const d=await r.json();
    if(d&&d.classes){
      localStorage.setItem(CLSKEY,JSON.stringify({classes:d.classes,last_rotation:d.last_rotation||{},default_settings:d.default_settings||{}}));
    }
  }catch(e){}
}

function getClassData(){
  try{const r=localStorage.getItem(CLSKEY);const d=JSON.parse(r);return (d&&d.classes)||{}}catch(e){return {}}
}

window.addEventListener('storage',e=>{if(e.key===CLSKEY){loadStudents().then(render)}});
window.addEventListener('message',e=>{if(e.data==='classRotatorData:changed'){loadStudents().then(render)}});

function applyLoad(){
  if(!ab.length)ab=JSON.parse(JSON.stringify(BANDS));
  if(!Object.keys(cs).length)CATS.forEach(c=>cs[c.id]={en:true,mx:c.max,sc:c.scale});
}

function migAndInit(){
  let mig=false;
  Object.keys(savedScores).forEach(k=>{const v=savedScores[k];if(v&&typeof v==='object'&&('mcq'in v||'fib'in v||'sa'in v||'frq'in v)&&!('ap'in v)){const c={mcq:v.mcq||'',fib:v.fib||'',sa:v.sa||'',frq:v.frq||''};savedScores[k]={ap:Object.assign({},c),formula:Object.assign({},c)};mig=true}});
  if(mig)save();
  applyLoad();
}

function load(){
  try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);cls=d.cls||'';cs=d.cs||{};ab=d.ab||[];fm=d.fm||'=RAW_PCT';mr=d.mr||100;savedScores=d.scores||{};orders=d.orders||{}}}catch(e){}
  // Prefer server copy (survives browser clearing / cross-browser) if present
  try{
    fetch('/api/curve').then(r=>r.json()).then(s=>{
      if(!s||!s.scores||!Object.keys(s.scores).length){migAndInit();render();return}
      cls=s.cls||cls;cs=s.cs||cs;ab=s.ab||ab;fm=s.fm||fm;mr=s.mr||mr;savedScores=s.scores||{};orders=s.orders||orders;
      save();migAndInit();render();
    }).catch(()=>migAndInit());
  }catch(e){migAndInit()}
}

function save(){localStorage.setItem(KEY,JSON.stringify({cls,cs,ab,fm,mr,scores:savedScores,orders}));
  try{fetch('/api/curve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cls,cs,ab,fm,mr,scores:savedScores,orders})}).catch(()=>{})}catch(e){}
}

function toast(m){$('toast').textContent=m;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}

async function loadStudents(){
  await initClassData();
  const classes=getClassData();
  const names=Object.keys(classes);
  $('classSelector').innerHTML='';
  if(!names.length){$('classSelector').innerHTML='<option>No classes</option>';st=[];render();return}
  names.forEach(n=>$('classSelector').innerHTML+='<option value="'+n+'">'+n+'</option>');
  if(!cls||!names.includes(cls))cls=names[0];
  $('classSelector').value=cls;
  st=classes[cls].map(s=>{
    const m=(savedScores[cls+'_'+s.id]||{})[mode]||{};
    return{
      id:s.id||'s_'+Math.random().toString(36).slice(2,9),
      name:s.name||s,
      mcq:m.mcq||'',fib:m.fib||'',sa:m.sa||'',frq:m.frq||''
    };
  });
  // Apply saved manual order for this class (students not listed keep their roster order at the end)
  const ord=orders&&orders[cls];
  if(Array.isArray(ord)&&ord.length){
    const pos={};ord.forEach((id,i)=>pos[id]=i);
    st.sort((a,b)=>{
      const pa=pos[a.id]!==undefined?pos[a.id]:9999;
      const pb=pos[b.id]!==undefined?pos[b.id]:9999;
      return pa-pb;
    });
  }
}

function loadStudentScores(){
  st.forEach(s=>{
    const m=(savedScores[cls+'_'+s.id]||{})[mode]||{};
    s.mcq=m.mcq||'';s.fib=m.fib||'';s.sa=m.sa||'';s.frq=m.frq||'';
  });
}

function render(){renderCats();renderTable();renderLegend();$('maxRaw').value=mr;$('formulaInput').value=fm}

function renderToggle(){
  CATS.forEach(cat=>{
    const en=cs[cat.id]&&cs[cat.id].en!==false;
    document.querySelectorAll('input[data-cat="'+cat.id+'"]').forEach(inp=>{
      inp.closest('td').style.display=en?'':'none';
    });
  });
}

function renderCats(){
  const c=$('catToggles');c.innerHTML='';
  CATS.forEach(cat=>{
    const s=cs[cat.id]||{};const en=s.en!==false;
    const w=document.createElement('div');w.className='cat-wrap';
    const t=document.createElement('span');t.className='cat-toggle'+(en?' enabled':'');
    t.innerHTML='<span class="cat-dot" style="background:'+cat.color+'"></span><span class="cat-label">'+cat.id.toUpperCase()+'</span>';
    t.onclick=()=>{cs[cat.id].en=!cs[cat.id].en;save();t.className='cat-toggle'+(cs[cat.id].en!==false?' enabled':'');renderToggle();updateCalcRows()};
    const m=document.createElement('input');m.className='cat-input';m.value=s.mx||cat.max;
    m.oninput=()=>{cs[cat.id].mx=parseFloat(m.value)||0;save();updateCalcRows()};
    w.appendChild(t);w.appendChild(m);
    if(cat.sc){const sc=document.createElement('input');sc.className='cat-input';sc.value=s.sc||cat.scale;sc.oninput=()=>{cs[cat.id].sc=parseFloat(sc.value)||0;save();updateCalcRows()};w.appendChild(sc)}
    c.appendChild(w);
  });
}

function getActive(){return CATS.filter(c=>cs[c.id]&&cs[c.id].en!==false)}

function calc(s){
  const a=getActive();let raw=0,scMcq=0;
  a.forEach(cat=>{
    const v=parseFloat(s[cat.id]||0)||0,mx=cs[cat.id].mx||cat.max;
    if(cat.sc){scMcq=(v/mx)*(cs[cat.id].sc||cat.scale)}else{raw+=v}
  });
  raw+=scMcq;
  const pct=mr>0?(raw/mr)*100:0;
  return{raw,pct,scMcq};
}

function calcAP(p){
  if(!p||p<=0)return{cv:null,ap:null};
  if(p>=100)return{cv:100,ap:5};
  let b=ab[ab.length-1];
  for(const x of ab){if(p>=x.rMin&&p<=x.rMax){b=x;break}}
  const w=(b.rMax-b.rMin)||1;
  return{cv:Math.max(0,Math.min(100,(p-b.rMin)/w*(b.cMax-b.cMin)+b.cMin)),ap:b.ap};
}

function evalF(f,ctx){
  let s=String(f||'').trim();if(!s)return{v:null,e:'Empty'};
  if(s.startsWith('='))s=s.slice(1);s=s.toUpperCase();
  try{
    const fn=new Function('RAW','RAW_PCT','MCQ','FIB','SA','FRQ','MAX_RAW','ROUND','MIN','MAX','IF','ABS','SQRT','SUM','AVG','return '+s);
    const v=fn(ctx.raw,ctx.pct,ctx.mcq||0,ctx.fib||0,ctx.sa||0,ctx.frq||0,mr,
      (n,d=0)=>{const p=Math.pow(10,d);return Math.round(n*p)/p},
      (...a)=>Math.min(...a),(...a)=>Math.max(...a),(c,a,b)=>c?a:b,x=>Math.abs(x),x=>Math.sqrt(x),(...a)=>a.reduce((x,y)=>x+y,0),(...a)=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0);
    return Number.isFinite(v)?{v,v,e:null}:{v:null,e:'Error'};
  }catch(e){return{v:null,e:'Error'}}
}

function updateCalcRows(){
  const bid=mode==='ap'?'apBody':'formulaBody';
  const body=$(bid);
  st.forEach((s,i)=>{
    const row=body.children[i];if(!row)return;
    const c=calc(s);
    const rr=row.querySelector('[data-c="raw"]');if(rr)rr.textContent=c.raw.toFixed(1);
    const pp=row.querySelector('[data-c="pct"]');if(pp)pp.textContent=c.pct.toFixed(1)+'%';
    const cv=row.querySelector('[data-c="curve"]');
    if(bid==='apBody'){
      const ap=calcAP(c.pct);
      if(cv)cv.textContent=ap.cv?ap.cv.toFixed(1)+'%':'-';
      const bd=row.querySelector('[data-c="ap"] .ap-badge');if(bd){bd.className='ap-badge ap-'+(ap.ap||1);bd.textContent=ap.ap||'-'}
    }else{
      const fr=evalF(fm,c);
      if(cv){cv.textContent=fr.v?fr.v.toFixed(1)+'%':(fr.e?'ERR':'-');cv.className=fr.e?'col-error':'col-highlight'}
    }
  });
}

function renderTable(onlyActive){
  const activeTabs=onlyActive?[mode==='ap'?'apBody':'formulaBody']:['apBody','formulaBody'];
  activeTabs.forEach(bid=>{
    const b=$(bid);b.innerHTML='';
    st.forEach((s,i)=>{
      const c=calc(s);const tr=document.createElement('tr');
      let h='<td>⋮ '+ (i+1)+'</td><td class="col-name">'+s.name+'</td>';
      CATS.forEach(cat=>{const en=cs[cat.id]&&cs[cat.id].en!==false;h+='<td class="col-input" style="display:'+(!en?'none':'')+'"><input data-id="'+s.id+'" data-cat="'+cat.id+'" value="'+(s[cat.id]||'')+'"></td>'});
      if(bid==='apBody'){
        const ap=calcAP(c.pct);h+='<td class="col-highlight" data-c="raw">'+c.raw.toFixed(1)+'</td><td class="col-highlight" data-c="pct">'+c.pct.toFixed(1)+'%</td><td class="col-highlight" data-c="curve">'+(ap.cv?ap.cv.toFixed(1)+'%':'-')+'</td><td data-c="ap"><span class="ap-badge ap-'+(ap.ap||1)+'">'+(ap.ap||'-')+'</span></td><td><button class="delete-btn" data-id="'+s.id+'">×</button></td>';
      }else{
        const r=evalF(fm,c);h+='<td class="col-highlight" data-c="raw">'+c.raw.toFixed(1)+'</td><td class="col-highlight" data-c="pct">'+c.pct.toFixed(1)+'%</td><td class="'+(r.e?'':'col-highlight')+'" data-c="curve">'+(r.v?r.v.toFixed(1)+'%':(r.e?'ERR':'-'))+'</td><td><button class="delete-btn" data-id="'+s.id+'">×</button></td>';
      }
      tr.innerHTML=h;
      tr.dataset.stid=s.id;
      tr.querySelectorAll('input[data-cat]').forEach(inp=>{
        inp.oninput=()=>{
          const id=inp.dataset.id,cat=inp.dataset.cat,stu=st.find(x=>x.id===id);
          if(stu){stu[cat]=inp.value;const k=cls+'_'+id;savedScores[k]=savedScores[k]||{};savedScores[k][mode]={mcq:stu.mcq,fib:stu.fib,sa:stu.sa,frq:stu.frq};save();updateCalcRows()}
        };
      });
      bindRowDrag(tr);
      b.appendChild(tr);
    });
  });
}

// Drag row to reorder students
function clearDropMarks(){
  document.querySelectorAll('tr.drag-over-top,tr.drag-over-bottom').forEach(r=>r.classList.remove('drag-over-top','drag-over-bottom'));
}
function bindRowDrag(tr){
  const handle=tr.children[0];
  if(!handle)return;
  handle.title='Drag to reorder';
  handle.addEventListener('mousedown',()=>{tr.draggable=true});
  tr.addEventListener('dragstart',e=>{
    dragRow=tr;tr.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';
    try{e.dataTransfer.setData('text/plain',tr.dataset.stid||'')}catch(_){}
  });
  tr.addEventListener('dragend',()=>{
    tr.draggable=false;tr.classList.remove('dragging');clearDropMarks();dragRow=null;
  });
  tr.addEventListener('dragover',e=>{
    if(!dragRow||dragRow===tr)return;
    e.preventDefault();e.dataTransfer.dropEffect='move';
    const r=tr.getBoundingClientRect();
    const before=(e.clientY-r.top)<r.height/2;
    clearDropMarks();
    tr.classList.add(before?'drag-over-top':'drag-over-bottom');
  });
  tr.addEventListener('dragleave',()=>tr.classList.remove('drag-over-top','drag-over-bottom'));
  tr.addEventListener('drop',e=>{
    if(!dragRow||dragRow===tr)return;
    e.preventDefault();
    const fromIdx=st.findIndex(x=>x.id===dragRow.dataset.stid);
    const targetId=tr.dataset.stid;
    if(fromIdx<0)return;
    const r=tr.getBoundingClientRect();
    const before=(e.clientY-r.top)<r.height/2;
    clearDropMarks();
    const moved=st.splice(fromIdx,1)[0];
    let toIdx=st.findIndex(x=>x.id===targetId);
    if(toIdx<0)toIdx=st.length-1;
    st.splice(before?toIdx:toIdx+1,0,moved);
    orders=orders||{};orders[cls]=st.map(x=>x.id);
    save();
    renderTable(true);
    toast('Order saved');
  });
}
document.addEventListener('mouseup',()=>{
  if(!dragRow)document.querySelectorAll('tr[draggable="true"]').forEach(r=>r.draggable=false);
});

function renderLegend(){
  const lg=$('apLegend');lg.innerHTML='';
  ab.forEach(b=>{
    const c=document.createElement('div');c.className='legend-card';
    c.innerHTML='<div class="legend-card-header"><span>AP '+b.ap+'</span><span class="ap-badge ap-'+b.ap+'">'+b.ap+'</span></div>'+
      '<div class="legend-row"><label>Raw Min</label><input data-ap="'+b.ap+'" data-f="rMin" value="'+b.rMin+'"><label>Raw Max</label><input data-ap="'+b.ap+'" data-f="rMax" value="'+b.rMax+'"></div>'+
      '<div class="legend-row"><label>Curve Min</label><input data-ap="'+b.ap+'" data-f="cMin" value="'+b.cMin+'"><label>Curve Max</label><input data-ap="'+b.ap+'" data-f="cMax" value="'+b.cMax+'"></div>';
    lg.appendChild(c);
  });
}

// Tab switching
$('tabAp').onclick=function(){
  $('tabAp').classList.add('active');$('tabFormula').classList.remove('active');
  $('tab-ap').classList.add('active');$('tab-formula').classList.remove('active');
  mode='ap';loadStudentScores();renderTable(true);
};
$('tabFormula').onclick=function(){
  $('tabFormula').classList.add('active');$('tabAp').classList.remove('active');
  $('tab-formula').classList.add('active');$('tab-ap').classList.remove('active');
  mode='formula';loadStudentScores();renderTable(true);
};

$('classSelector').onchange=async()=>{cls=$('classSelector').value;await loadStudents();render();save()};
$('maxRaw').oninput=()=>{mr=parseFloat($('maxRaw').value)||100;save();updateCalcRows()};
$('formulaInput').oninput=()=>{fm=$('formulaInput').value;save();updateCalcRows()};
$('apLegend').addEventListener('input',e=>{
  const i=e.target.closest('input[data-ap]');if(!i)return;
  const ap=parseInt(i.dataset.ap),f=i.dataset.f,v=parseFloat(i.value);
  if(!isNaN(v)){const b=ab.find(x=>x.ap===ap);if(b){b[f]=v;save();updateCalcRows()}}
});
$('apBody').addEventListener('click',e=>{const d=e.target.closest('.delete-btn');if(d){const s=st.find(x=>x.id===d.dataset.id);if(s&&!confirm('Remove '+s.name+'?'))return;st=st.filter(x=>x.id!==d.dataset.id);delete savedScores[cls+'_'+d.dataset.id];save();render();toast('Removed')}});
$('formulaBody').addEventListener('click',e=>{const d=e.target.closest('.delete-btn');if(d){const s=st.find(x=>x.id===d.dataset.id);if(s&&!confirm('Remove '+s.name+'?'))return;st=st.filter(x=>x.id!==d.dataset.id);delete savedScores[cls+'_'+d.dataset.id];save();render();toast('Removed')}});
$('addBtn').onclick=()=>{$('addModal').classList.add('show');$('newStudent').value='';setTimeout(()=>$('newStudent').focus(),50)};
$('closeModal').onclick=$('cancelModal').onclick=()=>$('addModal').classList.remove('show');
$('okModal').onclick=()=>{const n=$('newStudent').value.trim();if(!n){toast('Enter name');return}st.push({id:'s_'+Math.random().toString(36).slice(2,9),name:n,mcq:'',fib:'',sa:'',frq:''});save();$('addModal').classList.remove('show');toast('Added')};
$('newStudent').onkeydown=e=>{if(e.key==='Enter')$('okModal').click()};
$('clearBtn').onclick=()=>{
  if(!confirm('Clear ALL scores for '+cls+' in '+(mode==='ap'?'AP':'Formula')+' mode? This cannot be undone.'))return;
  st.forEach(s=>{
    s.mcq='';s.fib='';s.sa='';s.frq='';
    const k=cls+'_'+s.id;
    if(savedScores[k]) savedScores[k][mode]={mcq:'',fib:'',sa:'',frq:''};
  });
  save();
  updateCalcRows();
  renderTable(true);
  toast('Scores cleared');
};
$('reloadBtn').onclick=async()=>{load();await loadStudents();render();toast('Reloaded')};
$('exportBtn').onclick=()=>{
  const a=CATS.filter(c=>cs[c.id]&&cs[c.id].en!==false);
  let csv='#,Student,'+a.map(c=>c.id.toUpperCase()).join(',')+',Raw,Raw%,'+(mode=='ap'?'Curved%,AP':'Curved%')+'\n';
  st.forEach((s,i)=>{const c=calc(s);csv+=i+1+','+s.name+','+a.map(x=>s[x.id]||'').join(',')+','+c.raw.toFixed(1)+','+c.pct.toFixed(1);if(mode=='ap'){const ap=calcAP(c.pct);csv+=','+(ap.cv?ap.cv.toFixed(1):'-')+','+(ap.ap||'-')}else{const r=evalF(fm,c);csv+=','+(r.v?r.v.toFixed(1):'-')}csv+='\n'});
  const blob=new Blob([csv],{type:'text/csv'});const a2=document.createElement('a');a2.href=URL.createObjectURL(blob);a2.download=(cls||'curve').replace(/[^\w]/g,'_')+'.csv';a2.click();
};

window.addEventListener('beforeunload',save);
load();
loadStudents().then(()=>{render();toast('Loaded - auto-save ON')});
})();
</script>
