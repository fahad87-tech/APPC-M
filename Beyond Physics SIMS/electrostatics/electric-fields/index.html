<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Electric Fields Work</title>
<meta name="description" content="Interactive 3D drafting sheet showing electric field lines and equipotential contours for isolated, dipole, like, and uniform charges.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/sheet.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script>
  const SIM_AUTH = { hash: "11479c7493d51324cfd86082a9d5c255ba9ce02399839f4dc4f21d9a47d0ab7d", salt: "371b341008c326c55780b3fab691c8c0", iterations: 100000 };
  document.documentElement.classList.add("password-locked");
  let simBooted = false;

  function bootSimulation() {
    if (simBooted) return;
    simBooted = true;
    const s = document.createElement("script");
    s.type = "module";
    s.src = "js/main.js";
    document.body.appendChild(s);
  }

  async function pbkdf2Verify(password, storedHash, salt, iterations) {
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey("raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: enc.encode(salt), iterations: iterations, hash: "SHA-256" }, key, 256);
    const hex = Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, "0")).join("");
    return hex === storedHash;
  }

  function requestPassword(title, message) {
    return new Promise(resolve => {
      const existingGate = document.getElementById("password-gate");
      if (existingGate) existingGate.remove();
      const gate = document.createElement("div");
      gate.id = "password-gate";
      gate.innerHTML = `<div id="password-gate-card"><div id="password-gate-title">${title}</div><div id="password-gate-message">${message}</div><input id="password-gate-input" type="password" autocomplete="current-password"><div id="password-gate-actions"><button id="password-gate-cancel" class="password-gate-button" type="button">Cancel</button><button id="password-gate-submit" class="password-gate-button" type="button">Unlock</button></div></div>`;
      document.body.appendChild(gate);
      const input = document.getElementById("password-gate-input");
      const finish = value => { gate.remove(); resolve(value); };
      document.getElementById("password-gate-cancel").addEventListener("click", () => finish(null));
      document.getElementById("password-gate-submit").addEventListener("click", () => finish(input.value));
      input.addEventListener("keydown", event => { if (event.key === "Enter") finish(input.value); if (event.key === "Escape") finish(null); });
      window.requestAnimationFrame(() => input.focus());
    });
  }

  async function verifyPageAccess() {
    const userInput = await requestPassword("Simulation Access", "Classroom password required for this simulation:");
    if (userInput === null) { window.location.href = "../../index.html"; return; }
    if (await pbkdf2Verify(userInput, SIM_AUTH.hash, SIM_AUTH.salt, SIM_AUTH.iterations)) {
      document.documentElement.classList.remove("password-locked");
      bootSimulation();
    } else {
      alert("Incorrect password. Access denied.");
      window.location.href = "../../index.html";
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", verifyPageAccess, { once: true });
  } else {
    verifyPageAccess();
  }

  window.addEventListener("pageshow", (event) => {
    if (event.persisted) {
      document.documentElement.classList.add("password-locked");
      verifyPageAccess();
    }
  });
</script>
<style id="password-gate-styles">
  html.password-locked body { background: #0a0e1a !important; overflow: hidden; }
  html.password-locked body > * { visibility: hidden; }
  html.password-locked body > #password-gate { visibility: visible; }
  #password-gate {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(5, 9, 18, 0.88);
    padding: 24px;
    z-index: 9999;
  }
  html.password-locked #password-gate { display: flex; visibility: visible; }
  #password-gate-card {
    width: min(100%, 420px);
    background: #101625;
    border: 1px solid rgba(100,181,246,0.28);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    color: #e7edf7;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #password-gate-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  #password-gate-message { font-size: 14px; color: rgba(255,255,255,0.72); margin-bottom: 16px; line-height: 1.5; }
  #password-gate-input {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(100,181,246,0.35);
    background: rgba(255,255,255,0.05); color: #fff; font-size: 16px; outline: none; margin-bottom: 16px;
    box-sizing: border-box;
  }
  #password-gate-input:focus { border-color: #64b5f6; box-shadow: 0 0 0 3px rgba(100,181,246,0.16); }
  #password-gate-actions { display: flex; justify-content: flex-end; gap: 10px; }
  .password-gate-button { border: none; border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Segoe UI', Arial, sans-serif; }
  #password-gate-cancel { background: rgba(255,255,255,0.08); color: #d9e2f2; }
  #password-gate-submit { background: #64b5f6; color: #08101c; }
</style>
</head>
<!-- data-mechanism: a file in js/mechanisms/ (override with ?m=). data-layout: sheet | figure (override with ?layout=). -->
<body data-mechanism="electric-fields" data-layout="sheet">
  <noscript><p class="nojs">This drawing needs JavaScript to run the 3D model.</p></noscript>
</body>
</html>
